<text x="890" y="425" font-size="12" text-anchor="start" fill="#444" font-weight="normal">保護 IC、防反接與穩壓放在電源層（備援放在備援層），</text>
<text x="890" y="445" font-size="12" text-anchor="start" fill="#444" font-weight="normal">因為電池艙每邊只剩不到 1 mm，放不下保護板。</text>
<text x="890" y="475" font-size="12" text-anchor="start" fill="#444" font-weight="normal">主備之間只透過有隔離的序列線互報摘要（COMM-001），</text>
<text x="890" y="495" font-size="12" text-anchor="start" fill="#444" font-weight="normal">一邊短路或沒電不會拖垮另一邊。</text>
<text x="890" y="525" font-size="12" text-anchor="start" fill="#c0392b" font-weight="normal">2S 或 1S2P 尚未決定，要和電源層一起設計。</text>
<text x="890" y="545" font-size="12" text-anchor="start" fill="#444" font-weight="normal">充電在火箭外進行，或在接頭預留平衡充電線。</text>
<rect x="860" y="620" width="610" height="260" rx="0" fill="#fafafa" stroke="#ddd" stroke-width="1" />
<text x="890" y="648" font-size="14" text-anchor="start" fill="#222" font-weight="bold">整個航電艙：剛性固定、消除鬆動</text>
<circle cx="898" cy="676" r="3" fill="#555"/>
<text x="910" y="680" font-size="12" text-anchor="start" fill="#333" font-weight="normal">螺桿用尼龍防鬆螺帽或螺絲膠，間隔柱用金屬</text>
<circle cx="898" cy="704" r="3" fill="#555"/>
<text x="910" y="708" font-size="12" text-anchor="start" fill="#333" font-weight="normal">艙壁板與鼻錐固定環之間墊薄橡膠（左圖黑色）</text>
<circle cx="898" cy="732" r="3" fill="#555"/>
<text x="910" y="736" font-size="12" text-anchor="start" fill="#333" font-weight="normal">設備艙頂端加三個 TPU 小擋塊，防側向擺動</text>
<circle cx="898" cy="760" r="3" fill="#555"/>
<text x="910" y="764" font-size="12" text-anchor="start" fill="#333" font-weight="normal">公版追蹤器用束帶加泡棉綁在束線柱上</text>
<circle cx="898" cy="788" r="3" fill="#555"/>
<text x="910" y="792" font-size="12" text-anchor="start" fill="#333" font-weight="normal">大元件點膠固定，電路板塗三防漆</text>
<circle cx="898" cy="816" r="3" fill="#555"/>
<text x="910" y="820" font-size="12" text-anchor="start" fill="#333" font-weight="normal">艙壁板走線孔用索環或封泥封住，擋 CO2 氣體</text>
<circle cx="898" cy="844" r="3" fill="#555"/>
<text x="910" y="848" font-size="12" text-anchor="start" fill="#333" font-weight="normal">不把整組浮在軟墊上：與鼻錐只有 1.0 mm 間隙</text>
